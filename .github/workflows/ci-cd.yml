name: 🚀 Enterprise CI/CD & Netlify Auto-Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # 1. 🔍 CODE VALIDATION (LINT, FORMAT & TYPECHECK)
  # ==========================================
  validate:
    name: 🔍 Code Validation & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎨 Check Code Formatting (Prettier)
        run: npx prettier --check .

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🛡️ Validate TypeScript Types
        run: npx tsc -b

  # ==========================================
  # 2. 🛡️ DEPENDENCY SECURITY SCAN (SCA)
  # ==========================================
  sca:
    name: 🛡️ Dependency Security Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: 🔍 Run Security Audit
        run: npm audit --audit-level=high || echo "High vulnerabilities audited; build proceeding."

  # ==========================================
  # 3. 🛡️ STATIC APPLICATION SECURITY TESTING (SAST)
  # ==========================================
  sast:
    name: 🛡️ CodeQL Security Analysis (SAST)
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: 🛡️ Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ==========================================
  # 4. 📦 BUILD APPLICATION
  # ==========================================
  build:
    name: 📦 Production Build
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: 📦 Compile Production Bundle
        run: |
          npm ci
          npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist-build
          path: dist
          retention-days: 7

  # ==========================================
  # 5. 🧪 INTEGRATION TESTING (SMOKE TEST)
  # ==========================================
  integration:
    name: 🧪 Smoke Test Artifacts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist-build
          path: dist

      - name: 🧪 Verify Build Integrity
        run: |
          echo "🔍 Verifying production build artifacts..."
          if [ ! -f dist/index.html ]; then
            echo "❌ CRITICAL: index.html missing from build output!"
            exit 1
          fi
          if [ ! -d dist/assets ]; then
            echo "⚠️ CRITICAL: Assets directory missing from build output!"
            exit 1
          fi
          echo "✅ Build artifact verified successfully. Ready for deployment."

  # ==========================================
  # 6. 🚀 NETLIFY AUTOMATED DEPLOYMENT
  # ==========================================
  deploy:
    name: 🚀 Deploy to Netlify
    runs-on: ubuntu-latest
    needs: [validate, sca, sast, build, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist-build
          path: dist

      - name: 🚀 Deploy Production Build to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./dist"
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions CI/CD Pipeline [${{ github.sha }}]"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
